<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eadcc2">
  <title>A Letter for Kiara</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <p class="eyebrow">A little something, just for you</p>
    <h1>A letter for Kiara</h1>
    <p class="intro" id="instruction">Tap the envelope to open it.</p>

    <section class="letter-stage" aria-label="Interactive vintage letter">
      <button class="envelope-button" id="envelopeButton" type="button"
              aria-label="Open the envelope" aria-expanded="false">
        <span class="envelope-back"></span>
        <span class="letter-peek" aria-hidden="true"></span>
        <span class="envelope-flap"></span>
        <span class="envelope-front"></span>
        <span class="envelope-pocket-left"></span>
        <span class="envelope-pocket-right"></span>
        <span class="wax-seal" aria-hidden="true">K</span>
      </button>

      <article class="letter" id="letter" aria-hidden="true" tabindex="-1">
        <div class="letter-paper">
          <div class="paper-inner">
            <p class="letter-date">A little note, from the heart</p>
            <div class="ornament" aria-hidden="true">❦ ✦ ❦</div>
            <div id="letterMessage" class="letter-message"></div>
            <div class="signoff">With lots of love,</div>
            <div class="signature">Keanan, Keeno, Noelle</div>
            <div class="bottom-ornament" aria-hidden="true">— ❦ —</div>
          </div>
        </div>
      </article>
    </section>

    <div class="controls">
      <button class="action-button" id="openButton" type="button">Open the letter</button>
      <button class="action-button secondary" id="closeButton" type="button" hidden>Fold it away</button>
    </div>
    <p class="footnote">Made with care, for someone who matters.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
